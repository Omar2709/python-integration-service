[project]
name = "python-integration-service"
version = "0.1.0"
description = "Integration service for external vendor APIs"
readme = "README.md"
authors = [
    { name = "Omar2709", email = "omarrglopez@gmail.com" }
]
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
